[build-system]
requires = ["setuptools>=82.0.0", "wheel", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "midi-essentials"
version = "26.5.18"
description = "Convenience installer of all Tegridy Code packages for working with MIDIs"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Alex Lev", email = "alexlev61@proton.me" }
]
maintainers = [
  { name = "Alex Lev", email = "alexlev61@proton.me" }
]

dependencies = [
  "discovermidi",
  "midisim",
  "midisplitter",
  "midicap",
  "midiano",
  "mididoctor",
  "midiharmony",
  "beautifulmotifs",
  "midipca"
]

keywords = [
  "MIDI",
  "MIDI essentials",
  "MIDI tools",
  "MIDI packages",
  "MIDI utils",
  "music tools",
  "music information retrieval",
  "MIR",
  "tegridy",
  "project los angeles",
  "tegridy code",
  "convenience",
  "convenience installer"
]

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Multimedia :: Sound/Audio :: MIDI",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Environment :: Console",
  "Natural Language :: English",
  "Typing :: Typed"
]

requires-python = ">=3.8"

[project.readme]
file = "midi-essentials/README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/asigalov61/midi-essentials"
SoundCloud = "https://soundcloud.com/aleksandr-sigalov-61/"
Documentation = "https://github.com/asigalov61/midi-essentials"
Issues = "https://github.com/asigalov61/midi-essentials/issues"
Discussions = "https://github.com/asigalov61/midi-essentials/discussions"
Dataset = "https://huggingface.co/datasets/projectlosangeles/Discover-MIDI-Dataset"
